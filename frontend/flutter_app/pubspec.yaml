name: fitsync_ai
description: FitSync AI - A free, privacy-first, adaptive fitness coaching platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.0.0
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.11.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.3
  google_generative_ai: ^0.2.2
  path_provider: ^2.1.2
  flutter_markdown: ^0.6.18
  web_socket_channel: ^2.4.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  freezed: ^2.4.1
  json_serializable: ^8.1.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/

