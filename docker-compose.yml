version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: fitsync
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fitsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://fitsync:password@db:5432/fitsync_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretkey
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:

