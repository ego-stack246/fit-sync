steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/fitsync-backend:$COMMIT_SHA', '-f', 'backend/Dockerfile', 'backend']

  # Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fitsync-backend:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fitsync-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fitsync-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'JWT_SECRET=supersecretkey'

images:
  - 'gcr.io/$PROJECT_ID/fitsync-backend:$COMMIT_SHA'
